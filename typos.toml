[default]
extend-ignore-re = [
    "DELET",
    "RESTFul",
    "parametrized",
    "worke",
    "secon",
    "\\{Nd\\}",
    # UUID-shaped literals
    "[0-9a-fg-]{36}",
    # Regex fixtures spelled out of the letters `a` and `b`
    "\\(\\?:[ab|]+\\)",
    # Deliberate typos, used to show that a filter suggests the operation it nearly names
    "[Uu]esrs",
    # Deliberate typo, used to show that an invalid warning name suggests the one it nearly names
    "mising_auth",
]

[default.extend-words]
Nd = "Nd"
ninjs = "ninjs"

[files]
extend-exclude = ["test-corpus/__snapshots__/*/*.json", "test/config/__snapshots__/*/*.raw"]
