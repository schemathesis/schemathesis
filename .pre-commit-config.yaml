default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^.*\.raw$
      - id: trailing-whitespace
        exclude: ^.*\.(md|raw|ambr)$
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.24
    hooks:
      - id: actionlint
        # CI runners ship shellcheck, so pin it here too or the hook is stricter on CI than locally.
        additional_dependencies: [shellcheck-py==0.11.0.1]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.0
    hooks:
      - id: zizmor
        # Offline keeps the hook deterministic; online audits would need a GitHub token.
        args: [--no-progress, --offline]

  - repo: https://github.com/crate-ci/typos
    rev: v1.50.1
    hooks:
      - id: typos
        # Report, don't rewrite: mirrors the `spell-check` CI job
        args: [--force-exclude]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        exclude: ^(docs/|test/|test-corpus/|example/|benches/).*$
        args: ["--ignore-missing-imports"]
        additional_dependencies: [types-requests, types-PyYAML]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix, --show-fixes]
