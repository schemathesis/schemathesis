default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^.*\.raw$
      - id: trailing-whitespace
        exclude: ^.*\.(md|raw|ambr)$
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
        # CI runners ship shellcheck, so pin it here too or the hook is stricter on CI than locally.
        additional_dependencies: [shellcheck-py==0.11.0.1]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
        # Offline keeps the hook deterministic; online audits would need a GitHub token.
        args: [--no-progress, --offline]

  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
        # Report, don't rewrite
        args: [--force-exclude]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # Installs the project with its dependencies from `pyproject.toml`, so third-party types are checked.
        entry: uvx --python 3.11 --with-editable=.[tests] --with=types-requests --with=types-PyYAML mypy==2.4.0
        language: system
        types_or: [python, pyi]
        require_serial: true
        exclude: ^(docs/|test/|test-corpus/|examples/|benches/).*$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix, --show-fixes]
