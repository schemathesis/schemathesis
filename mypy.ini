[mypy]
python_version = 3.11
show_error_context = true
verbosity = 0
ignore_missing_imports = false
show_traceback = true
check_untyped_defs = true
cache_fine_grained = true
strict_equality = true
no_implicit_optional = true
warn_unreachable = true
warn_unused_ignores = true
enable_error_code = ignore-without-code
# The Allure logger ships without annotations.
untyped_calls_exclude = allure_commons

disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true

[mypy-schemathesis.cli]
disallow_untyped_decorators = false

[mypy-scripts.analyze.*]
disallow_untyped_decorators = false

# Installed without type information.
[mypy-django.*,harfile.*,xdist.*]
ignore_missing_imports = true

# Private `re` modules typeshed does not cover.
[mypy-re._constants,re._parser]
ignore_missing_imports = true

# Optional tooling dependencies, absent from the type-checking environment.
[mypy-matplotlib.*,orjson.*,pyinstrument.*,seaborn.*,tracecov.*]
ignore_missing_imports = true
