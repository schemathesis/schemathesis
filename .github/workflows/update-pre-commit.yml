name: Update pre-commit

on:
  schedule:
    - cron: 0 0 * * 0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    permissions:
      # Opens the autoupdate pull request.
      contents: write
      pull-requests: write
    name: Update pre-commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: true

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: "**/pyproject.toml"
          cache-suffix: update-pre-commit-v1

      - run: uvx prek autoupdate

      - name: Open pull request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-branch: true
          title: Update pre-commit
          body: Automatically update pre-commit
          commit-message: 'chore: Update pre-commit'
          committer: 'CI on behalf of the Schemathesis team <team@schemathesis.io>'
          author: 'CI on behalf of the Schemathesis team <team@schemathesis.io>'
          branch: "create-pull-request/update-pre-commit"
