name: Benchmarks

on:
  push:
    branches:
      - "master"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEMATHESIS_BENCHMARK_SEED: "42"
  PYTHONHASHSEED: "0"

jobs:
  benchmarks:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    name: "Run benchmarks (Shard #${{ matrix.shard }})"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run benchmarks
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          mode: "simulation"
          run: uvx --from=pytest --with=".[bench]" pytest benches/* --codspeed -p no:schemathesis -p no:hypothesispytest -p no:subtests -p no:anyio --test-group=${{ matrix.shard }} --test-group-count=4

  memory:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    name: "Track memory usage"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # Whole-engine runs, too slow for the Valgrind job above but the only shape that catches
      # memory blowups in the engine rather than in a single generator. They sit under
      # `benches/memory/` so the job above collects nothing from them: it globs `benches/*`, and a
      # directory is walked with the default `test_*.py` filter these modules deliberately fail.
      - name: Run memory benchmarks
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          mode: "memory"
          run: uvx --from=pytest --with=".[bench]" pytest benches/memory/engine_run.py --codspeed -p no:schemathesis -p no:hypothesispytest -p no:subtests -p no:anyio
