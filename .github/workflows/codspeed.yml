name: Benchmarks

on:
  push:
    branches:
      - "master"
    paths:
      - "src/**"
      - "benches/**"
      - "pyproject.toml"
      - ".github/workflows/codspeed.yml"
  pull_request:
    paths:
      - "src/**"
      - "benches/**"
      - "pyproject.toml"
      - ".github/workflows/codspeed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

jobs:
  benchmarks:
    permissions:
      # CodSpeed authenticates its upload over OIDC.
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: "Run benchmarks"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-dependency-glob: "**/pyproject.toml"
          cache-suffix: bench-3.12-v1

      - name: Run benchmarks
        uses: CodSpeedHQ/action@f842b9a3ffe213dbb81768fd7f7eeb4dfcf1c369 # v5.4.2
        with:
          mode: "simulation"
          run: uvx --from=pytest --with=".[bench]" pytest benches/* --codspeed -p no:schemathesis -p no:hypothesispytest -p no:subtests -p no:anyio

  memory:
    permissions:
      # CodSpeed authenticates its upload over OIDC.
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: "Track memory usage"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-dependency-glob: "**/pyproject.toml"
          cache-suffix: bench-memory-3.14-v1

      # Debug symbols let CodSpeed resolve libc frames in memory flamegraphs.
      - name: Install libc debug symbols
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libc6-dbg

      # Whole-engine runs, too slow for the Valgrind job above but the only shape that catches
      # memory blowups in the engine rather than in a single generator. They sit under
      # `benches/memory/` so the job above collects nothing from them: it globs `benches/*`, and a
      # directory is walked with the default `test_*.py` filter these modules deliberately fail.
      - name: Run memory benchmarks
        uses: CodSpeedHQ/action@f842b9a3ffe213dbb81768fd7f7eeb4dfcf1c369 # v5.4.2
        with:
          mode: "memory"
          run: uvx --from=pytest --with=".[bench]" pytest benches/memory/engine_run.py --codspeed -p no:schemathesis -p no:hypothesispytest -p no:subtests -p no:anyio
