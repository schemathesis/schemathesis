name: Auto-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  create-release:
    permissions:
      # Creates the GitHub release.
      contents: write
    name: Create GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Get release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python changelog.py notes "$VERSION" > release_notes.md

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PRERELEASE=""
          if [[ "$TAG" =~ -(alpha|beta|rc)[0-9]*$ ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$TAG" \
            --title "Release $VERSION" \
            --notes-file release_notes.md \
            --verify-tag \
            --latest=false \
            $PRERELEASE

  release_package:
    permissions:
      # Trusted Publishing exchanges this for a short-lived PyPI token.
      id-token: write
    environment: pypi
    name: Build and publish package to pypi.org
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-dependency-glob: "**/pyproject.toml"
          cache-suffix: release-3.10-v1

      - name: Build package
        run: uvx hatchling build

      - name: Publish distribution package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
