name: Auto-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  create-release:
    permissions:
      # Creates the GitHub release.
      contents: write
    name: Create GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Get release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python changelog.py notes "$VERSION" > release_notes.md

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PRERELEASE=""
          if [[ "$TAG" =~ -(alpha|beta|rc)[0-9]*$ ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$TAG" \
            --title "Release $VERSION" \
            --notes-file release_notes.md \
            --verify-tag \
            $PRERELEASE

  containers:
    permissions:
      # Pushes the container images to ghcr.io.
      packages: write
    name: Build container images
    needs: create-release
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            tag-suffix: ""
          - dockerfile: Dockerfile.trixie
            tag-suffix: "-trixie"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect pre-release
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$TAG_NAME" =~ -(alpha|beta|rc)[0-9]*$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_ENV"
          else
            echo "is_prerelease=false" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: Generate stable tag
        id: stable-tag
        env:
          TAG_SUFFIX: ${{ matrix.tag-suffix }}
        run: |
          if [ "$is_prerelease" == "false" ]; then
            if [ "$TAG_SUFFIX" == "" ]; then
              echo "stable_tag=type=raw,value=stable" >> "$GITHUB_OUTPUT"
            elif [ "$TAG_SUFFIX" == "-trixie" ]; then
              echo "stable_tag=type=raw,value=stable-trixie" >> "$GITHUB_OUTPUT"
            else
              echo "stable_tag=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "stable_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          flavor: |
            latest=false
          images: |
            schemathesis/schemathesis
            ghcr.io/schemathesis/schemathesis
          tags: |
            type=semver,pattern={{raw}}${{ matrix.tag-suffix }}
            type=semver,pattern={{version}}${{ matrix.tag-suffix }}
            ${{ steps.stable-tag.outputs.stable_tag }}

      - name: Build metadata
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          TAG_SUFFIX: ${{ matrix.tag-suffix }}
        run: |
          echo "Tags: $TAGS"
          echo "Is prerelease: $is_prerelease"
          echo "Tag suffix: '$TAG_SUFFIX'"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/schemathesis/schemathesis:buildcache${{ matrix.tag-suffix }}
          cache-to: type=registry,ref=ghcr.io/schemathesis/schemathesis:buildcache${{ matrix.tag-suffix }},mode=max

  release_package:
    permissions:
      # Trusted Publishing exchanges this for a short-lived PyPI token.
      id-token: write
    environment: pypi
    name: Build and publish package to pypi.org
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-dependency-glob: "**/pyproject.toml"
          cache-suffix: release-3.10-v1

      - name: Build package
        run: uvx hatchling build

      - name: Publish distribution package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  comment_on_issues:
    permissions:
      # Comments on the issues the release references.
      issues: write
    name: Comment on referenced issues
    needs: release_package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Comment on referenced issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Anything but a plain `vX.Y.Z` tag is a prerelease and is not announced.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipped $TAG: prerelease"
            exit 0
          fi
          VERSION="${TAG#v}"
          # Hidden so that rewording the announcement does not re-announce every issue.
          MARKER="<!-- schemathesis-release: $VERSION -->"
          BODY="Released in Schemathesis $VERSION, available on PyPI. Release notes: https://github.com/$REPOSITORY/releases/tag/v$VERSION"$'\n\n'"$MARKER"
          python changelog.py issues "$VERSION" > issue_numbers.txt
          while read -r NUMBER <&3; do
            if ! COMMENTS=$(gh issue view "$NUMBER" --repo "$REPOSITORY" --json comments --jq '.comments[].body'); then
              echo "Skipped #$NUMBER: its comments are unreachable"
              continue
            fi
            if printf '%s' "$COMMENTS" | grep -qF "$MARKER"; then
              echo "Skipped #$NUMBER: already announced"
              continue
            fi
            if ! gh issue comment "$NUMBER" --repo "$REPOSITORY" --body "$BODY"; then
              echo "Skipped #$NUMBER: the comment was rejected"
            fi
          done 3< issue_numbers.txt
        shell: bash
