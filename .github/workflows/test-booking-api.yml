name: Test booking API

on:
  pull_request:
    paths:
      - ".github/workflows/test-booking-api.yml"
      - "examples/**"
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  booking-api-test:
    name: Booking API (Schemathesis)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start containers
        run: docker compose up -d --build
        working-directory: "./examples/booking"

      - uses: schemathesis/action@806cace2053cbbac93188e1281ff7da415643160 # v3.0.0
        with:
          schema: "http://127.0.0.1:8080/openapi.json"
          authorization: "Bearer secret-token"
          max-examples: "10"
          wait-for-schema: "30"
          # POST /bookings intentionally exposes a tutorial bug; CI covers read paths only.
          args: "--report junit --include-method GET"

      - name: Upload test results
        uses: actions/upload-artifact@4a6144826a2d195578141a2c730256f066375b90 # v4.6.0
        if: always()
        with:
          name: schemathesis-results
          path: schemathesis-report/

      - name: Stop containers
        if: always()
        run: docker compose down
        working-directory: "./examples/booking"
