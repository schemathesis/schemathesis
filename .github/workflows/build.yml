name: CI

on:
  pull_request:
    paths:
      - "**.py"
      - "**.json"
      - "**.toml"
      - "**.yaml"
      - "**.yml"
      - ".yamllint"
      - "Justfile"
      - "mypy.ini"
      - "tox.ini"
  push:
    branches:
      - master
    paths:
      - "**.py"
      - "**.json"
      - "**.toml"
      - "**.yaml"
      - "**.yml"
      - ".yamllint"
      - "Justfile"
      - "mypy.ini"
      - "tox.ini"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  TOX_TESTENV_PASSENV: FORCE_COLOR

jobs:
  corpus-tooling:
    name: Corpus tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          cache-dependency-glob: "**/pyproject.toml"
          cache-suffix: corpus-tooling-3.14-v1

      - run: uvx ruff check tools scripts/analyze test/tooling

      - run: uvx ruff format --check tools scripts/analyze test/tooling

      - run: uvx --with=".[tests]" --with=mypy --with=types-PyYAML mypy tools/corpus scripts/analyze

      - run: uvx --with="tox" --with="tox-uv" tox -e tooling

  tests-old-pytest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - pytest: "8"
            tox-env: pytest8
          - pytest: "9.1"
            tox-env: pytest91
    name: Tests (pytest ${{ matrix.pytest }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          cache-dependency-glob: "**/pyproject.toml"
          cache-suffix: ${{ matrix.tox-env }}-3.13-v1

      - run: uvx --with="tox" --with="tox-uv" tox -e ${{ matrix.tox-env }}

      # The only jobs running the code paths for older pytest versions.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

      # Runs on failure too: a red job is exactly the sample flake detection needs.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: junit.xml
          disable_search: true
          flags: ${{ matrix.tox-env }}
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

  tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15", "3.15t"]
      fail-fast: false

    name: Tests (Python ${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          cache-dependency-glob: "**/pyproject.toml"
          cache-suffix: ${{ matrix.python }}-v2

      - run: uvx --with="tox" --with="tox-gh-actions" --with="tox-uv" tox

      # 3.12 and 3.13 run without coverage (see tox.ini).
      - name: Upload coverage to Codecov
        if: ${{ matrix.python != '3.12' && matrix.python != '3.13' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

      # Runs on failure too: a red job is exactly the sample flake detection needs.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: junit.xml
          disable_search: true
          flags: ${{ matrix.os }}-${{ matrix.python }}
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
