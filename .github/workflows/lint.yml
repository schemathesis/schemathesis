name: Lint

on:
  pull_request: ~
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Commitsar walks every commit in the range.
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-dependency-glob: "**/pyproject.toml"
          cache-suffix: lint-3.11-v1

      - run: uvx prek run --all-files

      # The published image; the action itself builds its Dockerfile on every run.
      - name: Run commitsar
        uses: docker://aevea/commitsar:1.0.3@sha256:b7f965c7717aae9339a92cc5975b5e0130b3a5b5f6e4323a57ab421d8c39f13d
