name: Lint

on:
  pull_request: ~
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Commitsar walks every commit in the range.
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.11

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          cache-dependency-glob: "**/pyproject.toml"
          cache-suffix: lint-3.11-v1

      - run: uvx prek run --all-files

      # The published image; the action itself builds its Dockerfile on every run.
      - name: Run commitsar
        uses: docker://aevea/commitsar:1.0.3@sha256:b7f965c7717aae9339a92cc5975b5e0130b3a5b5f6e4323a57ab421d8c39f13d
