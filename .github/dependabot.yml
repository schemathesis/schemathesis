version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # coverage 7.13.3+ can drop modules other threads are importing: coveragepy#2247
      - dependency-name: "coverage"
    cooldown:
      default-days: 7
