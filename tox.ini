[tox]
isolated_build = true
envlist =
  py{311,312,313,314,315},
  py315t,
  coverage-report

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315
    3.15t: py315t

[testenv]
extras =
  tests
  cov
  grpc
setenv =
    COVERAGE_PROCESS_START={toxinidir}/pyproject.toml
    COVERAGE_FILE={toxinidir}/.coverage
    COLUMNS=80
    NO_COLOR=1
    # Source has no version-specific code, so the other jobs measure coverage for 3.12 and 3.13 too.
    py312,py313: COVERAGE_PROCESS_START=
commands =
  py312,py313: python -m pytest --snapshot-warn-unused --junitxml=junit.xml -o junit_family=legacy {posargs:-n auto --dist worksteal --durations=10} test --ignore=test/tooling
  !py312-!py313: coverage run -m pytest --snapshot-warn-unused --junitxml=junit.xml -o junit_family=legacy {posargs:-n auto --dist worksteal --durations=10} test --ignore=test/tooling
  !py312-!py313: coverage combine --keep
  !py312-!py313: coverage report
  !py312-!py313: coverage xml -i
allowlist_externals =
  coverage

[testenv:py315t]
basepython = python3.15t
# grpcio ships no free-threaded wheels; tests that need it skip.
extras =
  tests
  cov
setenv =
    {[testenv]setenv}
    PYTHON_GIL=0

[testenv:pytest8]
description = Run the suite against the oldest supported pytest.
extras =
  tests
  cov
  grpc
deps =
  pytest>=8.4,<9
setenv =
    {[testenv]setenv}
    # pytest 8 does not know `strict_parametrization_ids`, so `--strict-config` would reject the config.
    PYTEST_ADDOPTS=-o "addopts=-ra --strict-markers"
commands = {[testenv]commands}
allowlist_externals =
  coverage

[testenv:pytest91]
description = Run the suite against pytest 9.1, the last version before structured node ids.
extras =
  tests
  cov
  grpc
deps =
  pytest>=9.1,<9.2
commands = {[testenv]commands}
allowlist_externals =
  coverage

[testenv:tooling]
description = Test the repo tooling: corpus, analyze and the coverage audit.
extras =
  tests
  scripts
commands =
  pytest test/tooling {posargs:-n auto --dist worksteal -q}

[testenv:coverage-report]
description = Report coverage over all measured test runs.
basepython = python3.11
deps = coverage[toml]>=5.3
skip_install = true
depends = py{311,312,313,314,315}
commands =
    coverage combine
    coverage report
    coverage xml -i {posargs:}
